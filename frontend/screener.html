<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinPulse Screener</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="screener.css">

</head>

<body>


    <nav class="navbar">

        <div class="logo">
            📈 <span>FinPulse</span>
        </div>

        <div class="nav-links">

            <a href="index.html">Markets</a>
            <a class="active" href="screener.html">Screener</a>
            <a href="compare.html">Compare</a>
            <a href="portfolio.html">Portfolio</a>

        </div>

        <div class="live-pill">
            🟢 Live Market
        </div>

    </nav>


    <div class="container">

        <section class="hero">

            <h1>🔎 Quantitative Stock Screener</h1>

            <p>
                Filter Indian listed companies using valuation ratios,
                profitability metrics and sector classification.
            </p>

        </section>

        <!-- FILTERS -->

        <section class="filters">

            <div class="filter-card">

                <label>Maximum P/E Ratio</label>

                <input type="range" min="5" max="60" value="60" id="peSlider">

                <span id="peValue">60</span>

            </div>

            <div class="filter-card">

                <label>Minimum ROE (%)</label>

                <input type="range" min="0" max="40" value="5" id="roeSlider">

                <span id="roeValue">5</span>

            </div>

        </section>


        <!-- SECTOR FILTER -->

        <div class="sector-filter">

            <button class="sector-chip active" data-sector="All">All</button>

            <button class="sector-chip" data-sector="IT Services">IT</button>

            <button class="sector-chip" data-sector="Financial Services">Finance</button>

            <button class="sector-chip" data-sector="Energy & Petrochemicals">Energy</button>

            <button class="sector-chip" data-sector="Healthcare & Pharma">Healthcare</button>

            <button class="sector-chip" data-sector="FMCG">FMCG</button>

            <button class="sector-chip" data-sector="Automobile">Auto</button>

            <button class="sector-chip" data-sector="Telecom">Telecom</button>

        </div>


        <!-- SEARCH -->

        <input id="searchBox" class="search-box" type="text" placeholder="🔍 Search Company or Ticker">


        <!-- RESULTS -->

        <h2>

            Screener Results
            (<span id="resultCount">0</span>)

        </h2>


        <!-- TABLE -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th id="sortTicker" class="sortable">
                            Ticker ↕
                        </th>

                        <th id="sortCompany" class="sortable">
                            Company ↕
                        </th>

                        <th id="sortSector" class="sortable">
                            Sector ↕
                        </th>

                        <th id="sortPrice" class="sortable">
                            Price ↕
                        </th>

                        <th id="sortPE" class="sortable">
                            P/E ↕
                        </th>

                        <th id="sortMarketCap" class="sortable">
                            Market Cap ↕
                        </th>

                        <th>
                            Inspect
                        </th>

                    </tr>

                </thead>

                <tbody id="tableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="screener.js"></script>

</body>

</html>
